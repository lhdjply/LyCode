name: 测试

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: 测试 (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装系统 Qt 与构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            cmake \
            ninja-build \
            g++ \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-l10n-tools \
            libqt6sql6-sqlite \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libfontconfig1-dev

      - name: 打印实际使用的 Qt 版本
        run: dpkg-query -W -f='${Package} ${Version}\n' qt6-base-dev

      - name: 配置
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DLYCODE_BUILD_TESTS=ON

      - name: 构建
        run: cmake --build build --parallel

      - name: 运行测试
        shell: bash
        run: |
          set +e
          ctest --test-dir build --output-on-failure 2>&1 | tee build/ctest-run.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo
            echo "########## 测试失败：下面是失败测试的完整日志 ##########"
            # ctest 的 --output-on-failure 在部分平台抓不到 QtTest 的输出（只剩下
            # 一句 Failed）。每个测试另外写了一份 build/tests/<name>.log，这里把
            # 失败的那几个直接打到 CI 日志里，不需要再去下载 artifact。
            names=$(grep -E '\*\*\*(Failed|Timeout|Exception)' build/ctest-run.log \
                    | sed -E 's/.*Test +#[0-9]+: *([^ .]+).*/\1/' | sort -u)
            if [ -z "$names" ]; then
              names=$(ls build/tests/*.log 2>/dev/null | xargs -r -n1 basename \
                      | sed 's/\.log$//')
            fi
            for name in $names; do
              echo
              echo "==================== $name ===================="
              cat "build/tests/$name.log" 2>/dev/null \
                || echo "(没有找到 build/tests/$name.log)"
            done
            echo "#######################################################"
            exit "$status"
          fi

      - name: 上传测试截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: build/tests/ui-screenshots
          if-no-files-found: ignore
          retention-days: 7

  test-windows:
    name: 测试 (Windows)
    runs-on: windows-latest

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          arch: win64_msvc2022_64
          cache: true
          modules: "qttools"

      - name: 配置
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DLYCODE_BUILD_TESTS=ON

      - name: 构建（含测试目标）
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: 运行测试
        shell: bash
        run: |
          set +e
          ctest --test-dir build -C RelWithDebInfo --output-on-failure \
            2>&1 | tee build/ctest-run.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo
            echo "########## 测试失败：下面是失败测试的完整日志 ##########"
            # Windows 上 ctest 的 --output-on-failure 曾经完全抓不到 QtTest 的输出，
            # 只剩一句 Failed。每个测试另外写了一份 build/tests/<name>.log，
            # 这里把失败的那几个直接打到 CI 日志里，不需要再去下载 artifact。
            names=$(grep -E '\*\*\*(Failed|Timeout|Exception)' build/ctest-run.log \
                    | sed -E 's/.*Test +#[0-9]+: *([^ .]+).*/\1/' | sort -u)
            if [ -z "$names" ]; then
              names=$(ls build/tests/*.log 2>/dev/null | xargs -r -n1 basename \
                      | sed 's/\.log$//')
            fi
            for name in $names; do
              echo
              echo "==================== $name ===================="
              cat "build/tests/$name.log" 2>/dev/null \
                || echo "(没有找到 build/tests/$name.log)"
            done
            echo "#######################################################"
            exit "$status"
          fi

      - name: 上传测试截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots-windows
          path: build/tests/ui-screenshots
          if-no-files-found: ignore
          retention-days: 7
